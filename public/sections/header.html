<header>
  <div class="wrap">
    <a href="#" class="logo">Краля</a>
    <nav class="links">
      <a href="#catalog">Каталог</a>
      <a href="#about">О бренде</a>
      <a href="#sizes">Размеры</a>
      <a href="#location">Магазин</a>
      <a href="#contact">Контакты</a>
    </nav>
    <a class="btn solid" href="#contact">Написать</a>
    <button class="cart-toggle" aria-label="Открыть корзину">
      <svg viewBox="0 0 20 20" width="19" height="19" fill="none"><path d="M4 6h12l-1 9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1L4 6Z" stroke="currentColor" stroke-width="1.3"/><path d="M7 6a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="cart-count is-empty">0</span>
    </button>
    <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobileNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- Вынесены за пределы <header>: у header есть backdrop-filter, а он создаёт
     свою систему координат для потомков с position:fixed, из-за чего меню
     "сжималось" и теряло фон вместо того, чтобы закрывать весь экран. -->
<div class="mobile-overlay" id="mobileOverlay"></div>
<nav class="mobile-nav" id="mobileNav">
  <a href="#catalog">Каталог</a>
  <a href="#about">О бренде</a>
  <a href="#sizes">Размеры</a>
  <a href="#location">Магазин</a>
  <a href="#contact">Контакты</a>
  <a class="btn solid mobile-cta" href="#contact">Написать</a>
  <button class="cart-toggle mobile-cart-toggle" aria-label="Открыть корзину">
    <span>Корзина</span>
    <span class="cart-count is-empty">0</span>
  </button>
</nav>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-panel" id="cartPanel" role="dialog" aria-label="Корзина" aria-hidden="true">
  <div id="cart-app">
    <div class="cart-panel-top">
      <h3>Корзина</h3>
      <button class="cart-panel-close" id="cartPanelClose" aria-label="Закрыть">
        <svg viewBox="0 0 20 20" width="18" height="18"><line x1="2" y1="2" x2="18" y2="18" stroke="currentColor" stroke-width="1.4"/><line x1="18" y1="2" x2="2" y2="18" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <p class="cart-empty" v-if="!items.length">Корзина пока пуста.</p>

    <div class="cart-items" v-else>
      <div class="cart-item" v-for="it in items" :key="it.id + it.size">
        <div class="cart-item-info">
          <h4>{{ it.name }}</h4>
          <p>Размер {{ it.size }}</p>
          <p class="cart-item-price">{{ formatPrice(it.price) }}</p>
        </div>
        <div class="cart-item-controls">
          <div class="qty-stepper">
            <button type="button" @click="setQty(it, it.qty - 1)" aria-label="Уменьшить количество">−</button>
            <span>{{ it.qty }}</span>
            <button type="button" @click="setQty(it, it.qty + 1)" aria-label="Увеличить количество">+</button>
          </div>
          <button class="cart-item-remove" type="button" @click="removeItem(it)" aria-label="Убрать из корзины">Убрать</button>
        </div>
      </div>
    </div>

    <div class="cart-panel-footer" v-if="items.length">
      <div class="cart-total">
        <span>Итого</span>
        <span>{{ formatPrice(total) }}</span>
      </div>
      <a class="btn solid cart-checkout" :href="checkoutLink" target="_blank" rel="noopener">Оформить заказ в Telegram</a>
    </div>
  </div>
</div>
